      ['gwangalli','광안리해수욕장','Gwangalli Beach','해변 · 야경','광안대교를 정면으로 바라보는 부산의 대표 해변입니다. 산책로와 카페가 이어져 낮과 밤 모두 가볍게 둘러보기 좋아요.','부산광역시 수영구 광안해변로 219',35.1532,129.1186,'Gwangalli Beach.jpg','광안대교 프레임 찾기','해변에서 광안대교가 가장 멋지게 들어오는 구도를 찾아 사진으로 남겨보세요.',120],
      ['gamcheon','감천문화마을','Gamcheon Culture Village','마을 · 예술','산복도로를 따라 알록달록한 집과 골목 예술이 이어지는 마을입니다. 천천히 걸으며 전망과 작은 공방을 만나보세요.','부산광역시 사하구 감내2로 203',35.0975,129.0092,'Gamcheon Culture Village.jpg','골목 색깔 수집','서로 다른 세 가지 색이 한 화면에 담긴 골목을 찾아보세요.',150],

      ['taejongdae','태종대유원지','Taejongdae Resort Park','해안 · 자연','영도 끝자락의 기암절벽과 탁 트인 대한해협을 만나는 부산 대표 해안 공원입니다.','부산광역시 영도구 전망로 24',35.05851,129.087686,'Taejongdae Park.jpg','절벽과 수평선 한 컷','절벽과 수평선이 함께 담기는 장면을 찾아보세요.',150],
      ['songdo','송도해수욕장','Songdo Beach','해변 · 케이블카','도심 가까이에서 바다 산책과 해상 케이블카 풍경을 함께 즐길 수 있습니다.','부산광역시 서구 송도해변로 100',35.075513,129.017308,'Songdo Beach Busan.jpg','바다 위 케이블카 포착','송도 바다 위를 지나는 케이블카를 사진에 담아보세요.',120],

      ['yongdusan','용두산공원','Yongdusan Park','공원 · 전망','부산타워와 함께 원도심과 항구 풍경을 내려다보는 역사 공원입니다.','부산광역시 중구 용두산길 37-55',35.100433,129.032606,'Yongdusan Park.jpg','부산타워와 원도심','부산타워와 원도심이 함께 보이는 구도를 찾아보세요.',120],

      ['huinnyeoul','흰여울문화마을','Huinnyeoul Culture Village','마을 · 산책','하얀 골목과 바다 전망이 이어지는 영도의 문화마을입니다.','부산광역시 영도구 영선동4가 605-3',35.077396,129.045651,'Huinnyeoul Culture Village.jpg','하얀 골목 끝 바다','골목 사이로 바다가 보이는 프레임을 찾아보세요.',140],
      ['dongbaek','동백섬','Dongbaekseom Island','숲길 · 해안','해운대와 누리마루를 잇는 숲길에서 바다와 광안대교를 조망할 수 있습니다.','부산광역시 해운대구 우동 710-1',35.154064,129.152086,'Dongbaekseom.jpg','숲과 바다의 경계','숲과 바다가 맞닿는 장면을 포착해보세요.',110],
      ['busan-citizens-park','부산시민공원','Busan Citizens Park','공원 · 휴식','도심 한가운데 넓은 잔디와 산책로가 어우러진 시민 휴식처입니다.','부산광역시 부산진구 시민공원로 73',35.16892,129.057338,'Busan Citizens Park.jpg','도심 속 쉼표','공원에서 가장 편안해 보이는 풍경을 남겨보세요.',100],
      ['f1963','F1963','F1963','문화 · 재생건축','옛 와이어 공장을 전시, 서점, 정원과 카페가 있는 복합문화공간으로 재생한 장소입니다.','부산광역시 수영구 구락로123번길 20',35.177106,129.114927,'F1963 Busan.jpg','공장의 흔적 찾기','문화공간 속 옛 와이어 공장의 흔적을 찾아보세요.',130]

    const app=document.querySelector('#app'),modal=document.querySelector('#modalRoot');
    const completed=()=>{try{return JSON.parse(localStorage.getItem('momentrip:completed')||'[]')}catch{return[]}};
    const saveCompleted=v=>localStorage.setItem('momentrip:completed',JSON.stringify(v));
    const locationFromSession=()=>{try{return JSON.parse(sessionStorage.getItem('momentrip:location')||'null')}catch{return null}};
    const saveLocation=v=>{state.location=v;sessionStorage.setItem('momentrip:location',JSON.stringify(v))};
    const rad=n=>n*Math.PI/180;
    const distance=(a,b)=>{const dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng),x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;return 6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};
    const byDistance=(items,origin)=>items.map(x=>({...x,distance:distance(origin,x)})).sort((a,b)=>a.distance-b.distance);
    const point=place=>({lat:place.lat,lng:place.lng});
    const placeById=id=>places.find(p=>p.id===id)||places[0];
    const updatePoints=()=>{const ids=completed();const total=places.filter(p=>ids.includes(p.id)).reduce((n,p)=>n+p.points,0);document.querySelector('#headerPoints').textContent=`${total}P`};
    const row=p=>`<div class="place-row"><a class="place-row-main" href="#/place/${p.id}"><img src="${p.image}" alt=""><div><b>${p.name}</b><small>${p.category}${p.distance!=null?` · ${p.distance.toFixed(1)}km`:''}</small></div></a><a class="arrow" href="#/place/${p.id}" aria-label="${p.name} 상세보기">→</a></div>`;
    const mapIcon=(label,extra='')=>L.divIcon({className:'',html:`<span class="map-marker ${extra}"><b>${label}</b></span>`,iconSize:[40,40],iconAnchor:[20,36]});
    const destroyMap=()=>{if(state.map){state.map.remove();state.map=null;state.cafeLayer=null}};
    function makeMap(id,center,zoom=13){destroyMap();if(!window.L){document.querySelector(`#${id}`).innerHTML='<p class="empty">지도를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.</p>';return null}const map=L.map(id).setView([center.lat,center.lng],zoom);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);state.map=map;return map}
    function renderHome(){destroyMap();app.innerHTML=`<section class="hero"><p class="eyebrow">어디로 떠나볼까요?</p><h1>낯선 곳을 발견하는<br><em>가장 쉬운 방법</em></h1><p>사진 한 장, 이름 하나, 지금 내 위치에서 여행이 시작돼요.</p></section><section class="features">
      <article class="card photo"><div class="card-head"><span class="icon">⌾</span><div><span class="step">01</span><h2>사진으로 찾기</h2></div></div><p>눈앞의 장소가 궁금하다면 사진을 찍어보세요.</p><label class="upload" id="uploadBox"><b>＋ 사진 촬영 또는 업로드</b><small>JPG, PNG · 최대 10MB</small><input id="photoInput" type="file" accept="image/*" capture="environment"></label><button class="btn" id="analyzeBtn" disabled>사진 분석하기</button><div id="analysisResult"></div></article>
      <article class="card search"><div class="card-head"><span class="icon">⌕</span><div><span class="step">02</span><h2>이름으로 검색</h2></div></div><p>가고 싶은 장소나 명소의 이름을 입력해보세요.</p><label class="field"><span>⌕</span><input id="searchInput" placeholder="예: 광안리, 태종대"></label><div class="results"><span class="results-label" id="resultsLabel">지금 많이 방문하는 장소</span><div id="searchResults">${places.slice(0,5).map(row).join('')}</div></div></article>
      <article class="card nearby"><div class="card-head"><span class="icon">⌖</span><div><span class="step">03</span><h2>주변 명소 보기</h2></div></div><p>현재 위치에서 가까운 부산 여행지를 만나보세요.</p><div class="location-art"><i></i></div><button class="btn coral" id="nearbyBtn">⌖ 주변 명소 보기</button><small class="privacy">위치는 명소 검색에만 사용하며 지속적으로 추적하지 않아요.</small></article></section><div class="notice"><b>정적 Mock 버전</b> · 모든 장소와 카페는 확인된 Seed 데이터에서만 추천합니다.</div>`;
      const input=document.querySelector('#photoInput'),button=document.querySelector('#analyzeBtn');
      input.onchange=()=>{const file=input.files?.[0];if(!file)return;const box=document.querySelector('#uploadBox');box.querySelector('img')?.remove();box.querySelector('b').classList.add('hidden');box.querySelector('small').classList.add('hidden');box.insertAdjacentHTML('afterbegin',`<img src="${URL.createObjectURL(file)}" alt="업로드 사진">`);button.disabled=false};
      button.onclick=()=>{button.textContent='사진을 분석하고 있어요…';button.disabled=true;setTimeout(()=>{const p=placeById('gamcheon');document.querySelector('#analysisResult').innerHTML=`<div class="analysis"><div class="analysis-top"><b>분석 결과</b><span class="match">87% 일치</span></div><h3>${p.name}</h3><p>${p.description}</p><a class="analysis-action" href="#/place/${p.id}"><b>장소 상세보기</b><span>→</span></a></div>`;button.textContent='사진 분석하기';button.disabled=false},700)};
      document.querySelector('#searchInput').oninput=e=>{const q=e.target.value.trim().toLowerCase();const found=q?places.filter(p=>`${p.name} ${p.en} ${p.category}`.toLowerCase().includes(q)):places.slice(0,5);document.querySelector('#resultsLabel').textContent=q?'검색 결과':'지금 많이 방문하는 장소';document.querySelector('#searchResults').innerHTML=found.length?found.map(row).join(''):'<p class="empty">검색 결과가 없어요.</p>'};
      document.querySelector('#nearbyBtn').onclick=()=>showConsent(()=>location.hash='#/explore');
    }
    function showConsent(next){modal.innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true"><button class="modal-close" aria-label="닫기">×</button><p class="eyebrow">LOCATION</p><h2>내 위치를 사용해<br>가까운 여행을 찾을까요?</h2><ul><li>주변 명소를 찾기 위해 현재 위치를 사용합니다.</li><li>길찾기의 출발지로 사용합니다.</li><li>가까운 AI 여행 미션 추천에 사용합니다.</li><li>위치는 지속적으로 추적하지 않습니다.</li><li>원하지 않으면 지역을 직접 입력할 수 있습니다.</li></ul><p id="modalError"></p><button class="btn coral" id="agreeLocation">동의하고 위치 사용</button><button class="btn light" id="manualToggle">직접 지역 입력</button><div class="manual hidden" id="manualArea"><label class="field"><input id="manualInput" placeholder="부산 또는 명소 이름"></label><button class="btn" id="manualGo">이 위치로 계속하기</button></div></section></div>`;
      document.querySelector('.modal-close').onclick=()=>modal.innerHTML='';
      document.querySelector('#manualToggle').onclick=()=>document.querySelector('#manualArea').classList.toggle('hidden');
      document.querySelector('#manualGo').onclick=()=>{const q=document.querySelector('#manualInput').value.trim();const p=places.find(x=>`${x.name} ${x.address}`.includes(q));const loc=p?{...point(p),label:p.name}:{lat:35.1796,lng:129.0756,label:'부산'};saveLocation(loc);modal.innerHTML='';next()};
      document.querySelector('#agreeLocation').onclick=()=>{const b=document.querySelector('#agreeLocation');b.disabled=true;b.textContent='현재 위치 확인 중…';if(!navigator.geolocation){document.querySelector('#modalError').className='modal-error';document.querySelector('#modalError').textContent='현재 환경에서는 위치 기능을 사용할 수 없습니다. 지역을 직접 입력해주세요.';b.disabled=false;return}navigator.geolocation.getCurrentPosition(pos=>{saveLocation({lat:pos.coords.latitude,lng:pos.coords.longitude,label:'현재 위치',accuracy:pos.coords.accuracy});modal.innerHTML='';next()},()=>{document.querySelector('#modalError').className='modal-error';document.querySelector('#modalError').textContent='위치를 가져오지 못했습니다. 지역을 직접 입력해주세요.';document.querySelector('#manualArea').classList.remove('hidden');b.disabled=false;b.textContent='동의하고 위치 사용'},{enableHighAccuracy:true,timeout:10000,maximumAge:300000})};
    }
    function renderPlace(id){const p=placeById(id);destroyMap();app.innerHTML=`<section class="page"><a class="back" href="#/home">← 홈으로</a><div class="detail-hero"><img src="${p.image}" alt="${p.name} 전경"><div class="shade"></div><div class="detail-title"><small>${p.category}</small><h1>${p.name}</h1></div></div><div class="detail-grid"><article class="panel"><p class="eyebrow">PLACE STORY</p><h2>${p.name}</h2><p>${p.description}</p><div class="address">⌖ ${p.address}</div></article><article class="panel"><p class="eyebrow">LOCATION</p><h2>지도에서 보기</h2><div id="detailMap" style="height:260px"></div><div class="actions"><a class="route-action" href="#/directions/${p.id}">길찾기 <span>→</span></a><a class="mission-action" href="#/explore/${p.id}">AI 여행 미션 <span>→</span></a></div></article></div></section>`;setTimeout(()=>{const m=makeMap('detailMap',p,14);if(m)L.marker([p.lat,p.lng],{icon:mapIcon('◆')}).addTo(m).bindTooltip(p.name)},0)}
    function renderExplore(requested){state.location=locationFromSession();if(!state.location){app.innerHTML=`<section class="page"><a class="back" href="#/home">← 홈으로</a><article class="panel" style="max-width:560px;margin:50px auto;text-align:center"><p class="eyebrow">AI MISSION MAP</p><h2>지도를 시작할 위치가 필요해요</h2><p>현재 위치를 사용하거나 부산 지역을 직접 입력할 수 있어요.</p><button class="btn coral" id="startMission">내 주변 AI 여행 미션 찾기</button></article></section>`;document.querySelector('#startMission').onclick=()=>showConsent(()=>renderExplore(requested));return}const ranked=byDistance(places,state.location).slice(0,12),requestedPlace=requested?places.find(p=>p.id===requested):null;state.selected=requestedPlace||ranked[0];app.innerHTML=`<section class="map-head"><div><p class="eyebrow">AI MISSION MAP</p><h1>내 주변 부산 여행 미션</h1><p><b>${state.location.label}</b> 기준 · ${state.location.lat.toFixed(4)}, ${state.location.lng.toFixed(4)}</p></div><button class="chip" id="refreshLocation">⌖ 위치 새로 요청</button></section><section class="map-shell"><div id="missionMap" class="map"></div><div id="missionSheet"></div></section><div class="notice"><b>부산 Seed ${places.length}곳</b> · 현재 위치 기준 가까운 최대 12곳과 주변 카페를 표시합니다.</div>`;
      document.querySelector('#refreshLocation').onclick=()=>showConsent(()=>renderExplore(state.selected.id));const map=makeMap('missionMap',state.location,12);if(!map)return;L.marker([state.location.lat,state.location.lng],{icon:mapIcon('●','user')}).addTo(map).bindTooltip('현재 위치');const ids=completed();ranked.forEach(p=>{const marker=L.marker([p.lat,p.lng],{icon:mapIcon(ids.includes(p.id)?'✓':'✦',ids.includes(p.id)?'done':'')}).addTo(map).bindTooltip(`${p.name} · ${p.points}P`);marker.on('click',()=>showMission(p,map))});showMission(state.selected,map)
    }
    function showMission(p,map){state.selected=p;const near=byDistance(cafes,p).slice(0,4),ids=completed(),done=ids.includes(p.id);if(state.cafeLayer)state.cafeLayer.remove();state.cafeLayer=L.layerGroup(near.map(c=>L.marker([c.lat,c.lng],{icon:mapIcon('☕','cafe-marker')}).bindTooltip(`${c.name} · ${c.distance.toFixed(1)}km`))).addTo(map);document.querySelector('#missionSheet').innerHTML=`<aside class="map-sheet"><div class="sheet-photo"><img src="${p.image}" alt="${p.name}"><span class="badge ${done?'done':''}">${done?'✓ 완료된 미션':`✦ ${p.points}P`}</span></div><div class="sheet-body"><small>${p.category} · ${distance(state.location,p).toFixed(1)}km</small><h2>${p.name}</h2><p>${p.description}</p><div class="mission-box"><span>✦</span><div><b>${p.mission}</b><p>${p.missionDescription}</p></div></div><div class="cafe-list"><small>NEARBY CAFE · 지도에 표시됨</small>${near.map(c=>`<div class="cafe"><span>☕</span><div><b>${c.name}</b><small>${c.address}</small></div><em>${c.distance.toFixed(1)}km</em></div>`).join('')}</div><div class="sheet-actions"><a href="#/directions/${p.id}">➜ 길찾기</a><label class="mission-upload ${done?'done':''}">${done?'✓ 완료된 미션':'▣ 사진 촬영 또는 업로드'}<input id="missionPhoto" type="file" accept="image/*" capture="environment" ${done?'disabled':''}></label></div></div></aside>`;const input=document.querySelector('#missionPhoto');if(input&&!done)input.onchange=()=>{if(!input.files?.[0])return;const next=[...new Set([...completed(),p.id])];saveCompleted(next);updatePoints();showMission(p,map)}}
    function renderDirections(id){const p=placeById(id);state.location=locationFromSession();if(!state.location){app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a><article class="panel"><p class="eyebrow">ROUTE GUIDE</p><h2>출발지를 정해주세요</h2><p>현재 위치 또는 부산의 장소를 출발지로 사용할 수 있어요.</p><button class="btn coral" id="routeLocation">현재 위치 또는 지역 입력</button></article></section>`;document.querySelector('#routeLocation').onclick=()=>showConsent(()=>renderDirections(id));return}const raw=distance(state.location,p),km=Math.max(.2,raw*1.18),minutes=Math.max(4,Math.round(km/22*60)),mid={lat:(state.location.lat+p.lat)/2+.001,lng:(state.location.lng+p.lng)/2};const facilities=[{name:'공공 화장실',icon:'WC',lat:mid.lat+.001,lng:mid.lng-.001,detour:.12},{name:'24시 편의점',icon:'24',lat:mid.lat-.001,lng:mid.lng+.0015,detour:.18},{name:'카페',icon:'☕',lat:mid.lat+.0004,lng:mid.lng+.002,detour:.25}];app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a><p class="eyebrow">ROUTE GUIDE</p><h1>${state.location.label}에서 ${p.name}까지</h1><div class="route-layout"><div id="routeMap" class="route-map"></div><aside class="route-info"><h2>추천 경로</h2><div class="metrics"><div><small>거리</small><b>${km.toFixed(1)}km</b></div><div><small>예상 시간</small><b>약 ${minutes}분</b></div></div><ol><li>${state.location.label}에서 출발</li><li>${km.toFixed(1)}km 동안 추천 경로로 이동</li><li>${p.name} 도착</li></ol><h3>경로 주변 편의시설</h3>${facilities.map(f=>`<div class="facility"><span>${f.icon}</span><b>${f.name}</b><em>+${f.detour.toFixed(2)}km 우회</em></div>`).join('')}</aside></div></section>`;setTimeout(()=>{const m=makeMap('routeMap',state.location,12);if(!m)return;L.marker([state.location.lat,state.location.lng],{icon:mapIcon('●','user')}).addTo(m);L.marker([p.lat,p.lng],{icon:mapIcon('◆')}).addTo(m);L.polyline([[state.location.lat,state.location.lng],[mid.lat,mid.lng],[p.lat,p.lng]],{color:'#e97055',weight:6,dashArray:'10 8'}).addTo(m);facilities.forEach(f=>L.marker([f.lat,f.lng],{icon:mapIcon(f.icon,'cafe-marker')}).addTo(m));m.fitBounds([[state.location.lat,state.location.lng],[p.lat,p.lng]],{padding:[45,45]})},0)}
    function route(){const [view,id]=location.hash.replace(/^#\//,'').split('/');if(view==='place')renderPlace(id);else if(view==='explore')renderExplore(id);else if(view==='directions')renderDirections(id);else renderHome();updatePoints();window.scrollTo(0,0)}
    window.addEventListener('hashchange',route);if(!location.hash)location.hash='#/home';else route();
  })();
  </script>
</body>
</html>
