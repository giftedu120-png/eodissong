    }
    function renderPlace(id){const p=placeById(id);destroyMap();app.innerHTML=`<section class="page"><a class="back" href="#/home">← 홈으로</a><div class="detail-hero"><img src="${p.image}" alt="${p.name} 전경"><div class="shade"></div><div class="detail-title"><small>${p.category}</small><h1>${p.name}</h1></div></div><div class="detail-grid"><article class="panel"><p class="eyebrow">PLACE STORY</p><h2>${p.name}</h2><p>${p.description}</p><div class="address">⌖ ${p.address}</div></article><article class="panel"><p class="eyebrow">LOCATION</p><h2>지도에서 보기</h2><div id="detailMap" style="height:260px"></div><div class="actions"><a class="route-action" href="#/directions/${p.id}">길찾기 <span>→</span></a><a class="mission-action" href="#/explore/${p.id}">AI 여행 미션 <span>→</span></a></div></article></div></section>`;setTimeout(()=>{const m=makeMap('detailMap',p,14);if(m)L.marker([p.lat,p.lng],{icon:mapIcon('◆')}).addTo(m).bindTooltip(p.name)},0)}
    function renderExplore(requested){state.location=locationFromSession();if(!state.location){app.innerHTML=`<section class="page"><a class="back" href="#/home">← 홈으로</a><article class="panel" style="max-width:560px;margin:50px auto;text-align:center"><p class="eyebrow">AI MISSION MAP</p><h2>지도를 시작할 위치가 필요해요</h2><p>현재 위치를 사용하거나 부산 지역을 직접 입력할 수 있어요.</p><button class="btn coral" id="startMission">내 주변 AI 여행 미션 찾기</button></article></section>`;document.querySelector('#startMission').onclick=()=>showConsent(()=>renderExplore(requested));return}const ranked=byDistance(places,state.location).slice(0,12),requestedPlace=requested?places.find(p=>p.id===requested):null;state.selected=requestedPlace||ranked[0];app.innerHTML=`<section class="map-head"><div><p class="eyebrow">AI MISSION MAP</p><h1>내 주변 부산 여행 미션</h1><p><b>${state.location.label}</b> 기준 · ${state.location.lat.toFixed(4)}, ${state.location.lng.toFixed(4)}</p></div><button class="chip" id="refreshLocation">⌖ 위치 새로 요청</button></section><section class="map-shell"><div id="missionMap" class="map"></div><div id="missionSheet"></div></section><div class="notice"><b>부산 Seed ${places.length}곳</b> · 현재 위치 기준 가까운 최대 12곳과 주변 카페를 표시합니다.</div>`;
      document.querySelector('#refreshLocation').onclick=()=>showConsent(()=>renderExplore(state.selected.id));const map=makeMap('missionMap',state.location,12);if(!map)return;L.marker([state.location.lat,state.location.lng],{icon:mapIcon('●','user')}).addTo(map).bindTooltip('현재 위치');const ids=completed();ranked.forEach(p=>{const marker=L.marker([p.lat,p.lng],{icon:mapIcon(ids.includes(p.id)?'✓':'✦',ids.includes(p.id)?'done':'')}).addTo(map).bindTooltip(`${p.name} · ${p.points}P`);marker.on('click',()=>showMission(p,map))});showMission(state.selected,map)
    }
    function showMission(p,map){state.selected=p;const near=byDistance(cafes,p).slice(0,6),ids=completed(),done=ids.includes(p.id);if(state.cafeLayer)state.cafeLayer.remove();state.cafeLayer=L.layerGroup(near.map(c=>L.marker([c.lat,c.lng],{icon:mapIcon('☕','cafe-marker')}).bindTooltip(`${c.name} · ${c.distance.toFixed(1)}km`))).addTo(map);document.querySelector('#missionSheet').innerHTML=`<aside class="map-sheet"><div class="sheet-photo"><img src="${p.image}" alt="${p.name}"><span class="badge ${done?'done':''}">${done?'✓ 완료된 미션':`✦ ${p.points}P`}</span></div><div class="sheet-body"><small>${p.category} · ${distance(state.location,p).toFixed(1)}km</small><h2>${p.name}</h2><p>${p.description}</p><div class="mission-box"><span>✦</span><div><b>${p.mission}</b><p>${p.missionDescription}</p></div></div><div class="cafe-list"><small>NEARBY CAFE · 지도에 표시됨</small>${near.map(c=>`<div class="cafe"><span>☕</span><div><b>${c.name}</b><small>${c.address}</small></div><em>${c.distance.toFixed(1)}km</em></div>`).join('')}</div><div class="sheet-actions"><a href="#/directions/${p.id}">➜ 길찾기</a>${done?'<span class="mission-upload done">✓ 완료된 미션</span>':'<div class="mission-upload-options" aria-label="미션 사진 선택 방법"><label class="mission-upload">📷 촬영<input id="missionCamera" type="file" accept="image/*" capture="environment"></label><label class="mission-upload file">▣ 파일 업로드<input id="missionFile" type="file" accept="image/*"></label></div>'}</div></div></aside>`;if(!done)document.querySelectorAll('#missionCamera,#missionFile').forEach(input=>input.onchange=()=>{if(!input.files?.[0])return;const next=[...new Set([...completed(),p.id])];saveCompleted(next);updatePoints();showMission(p,map)})}
    async function renderDirections(id){const p=placeById(id);state.location=locationFromSession();if(!state.location){app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a><p class="eyebrow">ROUTE GUIDE</p><h1>어디서 출발할까요?</h1>${originEditor(null)}<article class="panel"><h2>출발지를 선택해주세요</h2><p>현재 위치는 동의 후에만 요청하며, 동·도로명·역·건물명으로 세부 출발지를 지정할 수도 있어요.</p></article></section>`;bindOriginEditor(id);return}const origin=state.location,mid={lat:(origin.lat+p.lat)/2,lng:(origin.lng+p.lng)/2},nearestCafe=byDistance(cafes,mid)[0],facilities=[{name:'공공 화장실',icon:'WC',lat:mid.lat+.001,lng:mid.lng-.001,detour:.12},{name:'24시 편의점',icon:'24',lat:mid.lat-.001,lng:mid.lng+.0015,detour:.18},{name:nearestCafe.name,icon:'☕',lat:nearestCafe.lat,lng:nearestCafe.lng,detour:Math.min(9.99,nearestCafe.distance*2)}];app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a>${originEditor(origin)}<article class="panel" style="max-width:560px;margin:50px auto;text-align:center"><span class="spinner"></span><p class="eyebrow" style="margin-top:18px">ROAD NETWORK ROUTE</p><h2>실제 도로 경로를 찾고 있어요</h2><p>도로망을 따라 이동할 수 있는 경로와 예상 시간을 계산합니다.</p></article></section>`;bindOriginEditor(id);let result;try{result=await roadRoute(origin,p)}catch(error){if(!location.hash.includes(`/directions/${id}`))return;const message=error?.name==='AbortError'?'도로 경로 조회 시간이 초과되었습니다.':error?.message||'도로 경로를 불러오지 못했습니다.';app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a>${originEditor(origin)}<article class="panel" style="max-width:560px;margin:50px auto;text-align:center"><p class="eyebrow">ROUTE ERROR</p><h2>도로 경로를 불러오지 못했어요</h2><p>${message}<br>바다를 가로지르는 잘못된 직선 경로는 표시하지 않습니다.</p><a class="btn coral" style="display:grid;place-items:center" target="_blank" rel="noreferrer" href="https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=${origin.lat}%2C${origin.lng}%3B${p.lat}%2C${p.lng}">OpenStreetMap에서 경로 확인</a></article></section>`;bindOriginEditor(id);return}if(!location.hash.includes(`/directions/${id}`))return;app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a><p class="eyebrow">ROAD NETWORK ROUTE</p><h1>${origin.label}에서 ${p.name}까지</h1>${originEditor(origin)}<div class="route-layout"><div id="routeMap" class="route-map"></div><aside class="route-info"><h2>추천 경로</h2><p style="color:#087dbc;background:#e8f6ff;padding:8px 10px">✓ OpenStreetMap 도로망을 따른 자동차 경로</p><div class="metrics"><div><small>거리</small><b>${result.distanceKm.toFixed(1)}km</b></div><div><small>예상 시간</small><b>약 ${result.durationMinutes}분</b></div></div><ol>${result.steps.map(step=>`<li>${step}</li>`).join('')}</ol><h3>경로 주변 편의시설</h3>${facilities.map(f=>`<div class="facility"><span>${f.icon}</span><b>${f.name}</b><em>+${f.detour.toFixed(2)}km 우회</em></div>`).join('')}</aside></div></section>`;bindOriginEditor(id);setTimeout(()=>{const m=makeMap('routeMap',origin,12);if(!m)return;L.marker([origin.lat,origin.lng],{icon:mapIcon('●','user')}).addTo(m);L.marker([p.lat,p.lng],{icon:mapIcon('◆')}).addTo(m);L.polyline(result.path.map(point=>[point.lat,point.lng]),{color:'#139be5',weight:6,opacity:.9}).addTo(m);facilities.forEach(f=>L.marker([f.lat,f.lng],{icon:mapIcon(f.icon,'cafe-marker')}).addTo(m));m.fitBounds(result.path.map(point=>[point.lat,point.lng]),{padding:[45,45]})},0)}
    function route(){const [view,id]=location.hash.replace(/^#\//,'').split('/');if(view==='place')renderPlace(id);else if(view==='explore')renderExplore(id);else if(view==='directions')renderDirections(id);else renderHome();updatePoints();window.scrollTo(0,0)}
    const languageSelect=document.querySelector('#languageSelect');languageSelect.value=currentLocale;languageSelect.onchange=()=>{currentLocale=languageSelect.value;try{localStorage.setItem('eodissong:locale',currentLocale)}catch{}modal.innerHTML='';syncLanguageChrome();route()};
    new MutationObserver(()=>translateTree(document.body)).observe(document.body,{childList:true,subtree:true});
    syncLanguageChrome();window.addEventListener('hashchange',route);if(!location.hash)location.hash='#/home';else route();
  })();
  </script>
</body>
</html>
