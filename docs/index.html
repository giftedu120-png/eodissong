    function renderCourseResult(result){destroyMap();const origin=locationFromSession();if(!origin){state.courseResult=null;renderCourse();return}app.innerHTML=`<section class="page"><a class="back" href="#/home">← 홈으로</a><p class="eyebrow">AI COURSE</p><h1>완성된 추천 코스</h1><div class="route-layout"><div id="courseMap" class="course-map"></div><aside class="route-info"><h2>방문 순서</h2><p style="color:#087dbc;background:#e8f6ff;padding:8px 10px">✓ 실제 도로 최단 순서 · 최종 목적지는 마지막</p><div class="metrics"><div><small>거리</small><b>${result.distanceKm.toFixed(1)}km</b></div><div><small>예상 시간</small><b>약 ${result.durationMinutes}분</b></div></div><p class="estimate-note">이는 예상 시간이며, 실제와 맞지 않을수도 있습니다</p><ol class="course-route-list"><li><span>⌖</span><b>${origin.label}</b></li>${result.stops.map((stop,index)=>`<li class="${stop.type==='cafe'?'cafe-stop':stop.type==='destination'?'destination-stop':''}"><span>${stop.type==='cafe'?'☕':stop.type==='destination'?'◎':index+1}</span><div><b>${escapeHtml(stop.name)}</b><small>${stop.type==='cafe'?'추천 카페':stop.type==='destination'?'최종 목적지':escapeHtml(stop.category)}</small></div></li>`).join('')}</ol><button class="btn light" id="resetCourse">코스 다시 설정</button></aside></div></section>`;document.querySelector('#resetCourse').onclick=()=>{state.courseResult=null;renderCourse()};setTimeout(()=>{const map=makeMap('courseMap',origin,12);if(!map)return;L.marker([origin.lat,origin.lng],{icon:mapIcon('●','user')}).addTo(map).bindTooltip(origin.label);result.stops.forEach((stop,index)=>L.marker([stop.lat,stop.lng],{icon:mapIcon(stop.type==='cafe'?'☕':stop.type==='destination'?'◎':String(index+1),stop.type==='cafe'?'cafe-marker':stop.type==='destination'?'done':'')}).addTo(map).bindTooltip(stop.name));L.polyline(result.path.map(point=>[point.lat,point.lng]),{color:'#139be5',weight:6,opacity:.9}).addTo(map);map.fitBounds(result.path.map(point=>[point.lat,point.lng]),{padding:[45,45]})},0)}
    async function renderDirections(id){const p=placeById(id);state.location=locationFromSession();if(!state.location){app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a><p class="eyebrow">ROUTE GUIDE</p><h1>어디서 출발할까요?</h1>${originEditor(null)}<article class="panel"><h2>출발지를 선택해주세요</h2><p>현재 위치는 동의 후에만 요청하며, 동·도로명·역·건물명으로 세부 출발지를 지정할 수도 있어요.</p></article></section>`;bindOriginEditor(id);return}const origin=state.location,mid={lat:(origin.lat+p.lat)/2,lng:(origin.lng+p.lng)/2},nearestCafe=byDistance(cafes,mid)[0],facilities=[{name:'공공 화장실',icon:'WC',lat:mid.lat+.001,lng:mid.lng-.001,detour:.12},{name:'24시 편의점',icon:'24',lat:mid.lat-.001,lng:mid.lng+.0015,detour:.18},{name:nearestCafe.name,icon:'☕',lat:nearestCafe.lat,lng:nearestCafe.lng,detour:Math.min(9.99,nearestCafe.distance*2)}];app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a>${originEditor(origin)}<article class="panel" style="max-width:560px;margin:50px auto;text-align:center"><span class="spinner"></span><p class="eyebrow" style="margin-top:18px">ROAD NETWORK ROUTE</p><h2>실제 도로 경로를 찾고 있어요</h2><p>도로망을 따라 이동할 수 있는 경로와 예상 시간을 계산합니다.</p></article></section>`;bindOriginEditor(id);let result;try{result=await roadRoute(origin,p)}catch(error){if(!location.hash.includes(`/directions/${id}`))return;const message=error?.name==='AbortError'?'도로 경로 조회 시간이 초과되었습니다.':error?.message||'도로 경로를 불러오지 못했습니다.';app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a>${originEditor(origin)}<article class="panel" style="max-width:560px;margin:50px auto;text-align:center"><p class="eyebrow">ROUTE ERROR</p><h2>도로 경로를 불러오지 못했어요</h2><p>${message}<br>바다를 가로지르는 잘못된 직선 경로는 표시하지 않습니다.</p><a class="btn coral" style="display:grid;place-items:center" target="_blank" rel="noreferrer" href="https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=${origin.lat}%2C${origin.lng}%3B${p.lat}%2C${p.lng}">OpenStreetMap에서 경로 확인</a></article></section>`;bindOriginEditor(id);return}if(!location.hash.includes(`/directions/${id}`))return;app.innerHTML=`<section class="page"><a class="back" href="#/place/${p.id}">← ${p.name}</a><p class="eyebrow">ROAD NETWORK ROUTE</p><h1>${origin.label}에서 ${p.name}까지</h1>${originEditor(origin)}<div class="route-layout"><div id="routeMap" class="route-map"></div><aside class="route-info"><h2>추천 경로</h2><p style="color:#087dbc;background:#e8f6ff;padding:8px 10px">✓ OpenStreetMap 도로망을 따른 자동차 경로</p><div class="metrics"><div><small>거리</small><b>${result.distanceKm.toFixed(1)}km</b></div><div><small>예상 시간</small><b>약 ${result.durationMinutes}분</b></div></div><p class="estimate-note">이는 예상 시간이며, 실제와 맞지 않을수도 있습니다</p><ol>${result.steps.map(step=>`<li>${step}</li>`).join('')}</ol><h3>경로 주변 편의시설</h3>${facilities.map(f=>`<div class="facility"><span>${f.icon}</span><b>${f.name}</b><em>+${f.detour.toFixed(2)}km 우회</em></div>`).join('')}</aside></div></section>`;bindOriginEditor(id);setTimeout(()=>{const m=makeMap('routeMap',origin,12);if(!m)return;L.marker([origin.lat,origin.lng],{icon:mapIcon('●','user')}).addTo(m);L.marker([p.lat,p.lng],{icon:mapIcon('◆')}).addTo(m);L.polyline(result.path.map(point=>[point.lat,point.lng]),{color:'#139be5',weight:6,opacity:.9}).addTo(m);facilities.forEach(f=>L.marker([f.lat,f.lng],{icon:mapIcon(f.icon,'cafe-marker')}).addTo(m));m.fitBounds(result.path.map(point=>[point.lat,point.lng]),{padding:[45,45]})},0)}
    const baseDirectionsRenderer=renderDirections;renderDirections=async id=>id==='course'?renderCourse():baseDirectionsRenderer(id);
    function route(){const [view,id]=location.hash.replace(/^#\//,'').split('/');if(view==='place')renderPlace(id);else if(view==='explore')renderExplore(id);else if(view==='course')renderCourse();else if(view==='directions')renderDirections(id);else renderHome();updatePoints();window.scrollTo(0,0)}
    const languageSelect=document.querySelector('#languageSelect');languageSelect.value=currentLocale;languageSelect.onchange=()=>{currentLocale=languageSelect.value;try{localStorage.setItem('eodissong:locale',currentLocale)}catch{}modal.innerHTML='';syncLanguageChrome();route()};
    new MutationObserver(()=>translateTree(document.body)).observe(document.body,{childList:true,subtree:true});
    syncLanguageChrome();window.addEventListener('hashchange',route);if(!location.hash)location.hash='#/home';else route();
  })();
  </script>
